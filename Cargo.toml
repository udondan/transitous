[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/udondan/transitous"
authors = ["Daniel Schroeder"]

# Library crates (motis, transitous-core, motis-sim) use regular version
# requirements, so their users don't run into version conflicts. The
# transitous binary declares its own dependencies with exact versions.
# Cargo.lock pins every build.
[workspace.dependencies]
motis = { path = "crates/motis", version = "1.0.0" }
transitous-core = { path = "crates/transitous-core", version = "1.0.0" }

# Dependencies of the tests only, under a key other than the crate name.
# Release Please releases every crate that depends on a released crate, and it
# finds those dependencies by their key, in dev-dependencies too. Under these
# keys, a release of motis or motis-sim releases no crate that needs them for
# its tests only. Keep the keys.
motis_dev = { package = "motis", path = "crates/motis" }
motis_sim = { package = "motis-sim", path = "crates/motis-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
