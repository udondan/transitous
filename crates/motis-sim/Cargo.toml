[package]
name = "motis-sim"
version = "0.1.0"
description = "Fake MOTIS 2 server for tests, serving recorded Transitous responses with injected cancellations, delays and errors"
keywords = ["motis", "transitous", "public-transport", "testing", "mock"]
categories = ["development-tools::testing"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
form_urlencoded = "1.2.3"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt", "signal", "time"] }

[dev-dependencies]
motis = { workspace = true }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
