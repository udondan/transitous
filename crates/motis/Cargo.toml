[package]
name = "motis"
version = "1.0.0"
description = "Client for the MOTIS 2 public transport routing API"
keywords = ["motis", "transit", "gtfs", "routing", "api"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
jiff = { version = "1.0.3", default-features = false, features = ["serde", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
webpki-roots = "1.0.12"

[lints]
workspace = true

[dev-dependencies]
axum = "=0.8.9"
serde-saphyr = "=2.2.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
