[package]
name = "transitous-core"
version = "0.1.0"
description = "Usage rules, stop resolution and connection status for the Transitous API"
keywords = ["transitous", "transit", "public-transport", "realtime"]
categories = ["api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
directories = "6.0.0"
# The bundled time zone database, so times keep their zone on systems
# without one, like a minimal container.
jiff = { version = "1.0.3", features = ["serde", "tzdb-bundle-always"] }
motis.workspace = true
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
motis_sim.workspace = true

[lints]
workspace = true
