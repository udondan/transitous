[package]
name = "transitous"
version = "1.2.0"
description = "CLI and MCP server for public transport connections and departures on the Transitous API, with realtime status"
keywords = ["transitous", "transit", "public-transport", "mcp", "cli"]
categories = ["command-line-utilities"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "transitous"
path = "src/main.rs"

# The binary pins exact versions, see the workspace manifest.
[dependencies]
anyhow = "=1.0.105"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "=4.6.9", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "=4.6.12", features = ["unstable-dynamic"] }
jiff = { version = "=1.0.3", features = ["serde"] }
motis.workspace = true
rmcp = { version = "=3.11.0", default-features = false, features = ["macros", "schemars", "server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["serialize"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = "=0.7.20"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
transitous-core.workspace = true

[dev-dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# The HTTP client of rmcp needs a crypto provider, also for plain HTTP.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
motis_sim.workspace = true

[lints]
workspace = true
