[package]
name = "transitous"
version = "0.0.0"
description = "CLI and MCP server for public transport connections and departures on the Transitous API, with realtime status"
keywords = ["transitous", "transit", "public-transport", "mcp", "cli"]
categories = ["command-line-utilities"]
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "transitous"
path = "src/main.rs"

# The binary pins exact versions, see the workspace manifest.
[dependencies]
anyhow = "=1.0.105"
clap = { version = "=4.6.9", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "=4.6.12", features = ["unstable-dynamic"] }
jiff = { version = "=1.0.3", features = ["serde"] }
motis.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["serialize"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
transitous-core.workspace = true

[dev-dependencies]
serde-saphyr = { version = "=2.2.0", default-features = false, features = ["deserialize"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
transitous-sim.workspace = true

[lints]
workspace = true
