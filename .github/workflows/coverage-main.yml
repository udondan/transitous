---
name: Coverage

# Codecov compares the coverage of a pull request against main, so main needs
# a report as well. The Test workflow runs on main too, but only after all
# waiting pull requests. This workflow runs the tests and uploads their
# coverage right away, so pull requests have a report to compare against.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      # Restores the cache the Test workflow saves on main, but doesn't write
      # its own entry.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Test
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: lcov.info
