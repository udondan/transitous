---
name: Conventional PR Title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  # Squash merges use the PR title as the commit message, which release-please
  # reads. A crate as scope puts the change in the release notes of that crate
  # only (.github/scripts/release-notes-scope.py).
  conventional-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            motis
            transitous-core
            transitous-sim
            transitous
            deps
