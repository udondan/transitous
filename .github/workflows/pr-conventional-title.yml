---
name: Conventional PR Title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  # Squash merges use the PR title as the commit message, which release-please
  # reads. A crate as scope puts the change in the release notes of that crate
  # only, and of the crates that depend on it under "Dependencies"
  # (.github/scripts/release-notes-*.py).
  conventional-pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            motis
            transitous-core
            motis-sim
            transitous
            deps
