---
name: Test

# All tests run against recorded fixtures and the simulator. Nothing in CI talks
# to the real Transitous API.
#
# The boarding-gate job queues the runs of pull requests and main, pull requests
# first, and rebases branches that are behind main. A workflow-wide concurrency
# group is not used for this because GitHub keeps only one pending run per group
# and cancels the others.
#
# Pull requests from forks get no secrets. They skip the wait and run the jobs
# right away.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job waits for its turn, so the waiting runs of all open pull requests
  # don't take the runners at once; most of them are tested again after a
  # rebase anyway. A skipped job fails the required job, so the jobs run even
  # if boarding-gate failed and fail in their first step.
  boarding-gate:
    name: Queue
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # Pull requests run the build, the image and the workflow checks only if
  # files changed that they use. Pushes to main skip this job and always run
  # everything. The tests only read files under crates/. qlty always runs: it
  # lints every file, the docs as well.
  changes:
    needs: boarding-gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of the pull request via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      actions: ${{ steps.filter.outputs.actions }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - clippy.toml
              - codecov.yml
              - .github/workflows/test.yml
            docker:
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - Dockerfile
              - .dockerignore
              - docker-mcp.yml
              - mise.toml
              - .github/workflows/test.yml
            actions:
              - .github/**
              - mise.toml
            tools:
              - crates/transitous/tests/data/mcp-tools.json
              - mise.toml
              - .github/workflows/test.yml

  build:
    needs: [boarding-gate, changes]
    # Skipped if no code changed. The wait is skipped for forks.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. Pull requests restore it but don't add
          # their own entries, which keeps the cache storage small.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Lints the default features and all features.
      - name: Lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      # Coverage of main is uploaded by the Coverage workflow, without waiting
      # in the queue.
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: lcov.info

  # Codecov reports its checks asynchronously. This job waits for them, so the
  # required job can depend on the coverage result.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  qlty:
    needs: boarding-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@56bee2d751c94b7bd8de22f64c9b5f398048e13f # v2.8.1

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  actions:
    needs: [boarding-gate, changes]
    # Skipped if no workflow or tool version changed.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.actions == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Lints the MCP tool descriptions with the deterministic checks of Glama's
  # Tool Definition Quality Score (TDQS). It reads the tool list of the golden
  # file, which the tests keep equal to what the server sends. Warnings fail
  # the job, notes only go into the summary.
  tdqs:
    name: TDQS
    needs: [boarding-gate, changes]
    # Skipped if neither the tool list nor the linter changed.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.tools == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node npm:mcp-tdqs

      - name: Lint the tool descriptions
        run: |
          status=0
          tdqs lint --file crates/transitous/tests/data/mcp-tools.json --server-name transitous \
            --fail-on warning --format markdown --output tdqs.md || status=$?
          cat tdqs.md
          cat tdqs.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Builds the image and runs it the way the Docker MCP Toolkit does, through
  # a profile and the gateway. Needs no network: listing the tools sends no
  # request.
  docker:
    name: Docker
    needs: [boarding-gate, changes]
    # Skipped if nothing changed that goes into the image.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.docker == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: github:docker/mcp-gateway

      - name: Install docker mcp plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          ln -s "$(mise which docker-mcp)" ~/.docker/cli-plugins/docker-mcp
          docker mcp version

      # The image of a release is built from its binaries in publish.yml. This
      # job only checks that the image starts and lists its tools, so an
      # unoptimized musl build on the runner is enough. Built here and not in
      # the Docker build, the dependencies come from the cache. ring needs
      # musl-gcc.
      - name: Install the toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup update stable
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docker-musl
          # Only main writes the cache, as in the build job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the binary
        run: |
          cargo build --locked -p transitous --target x86_64-unknown-linux-musl
          mkdir -p dist/amd64
          cp target/x86_64-unknown-linux-musl/debug/transitous dist/amd64/transitous

      - name: Build the image
        run: docker build --build-arg BINARY=prebuilt -t udondan/transitous .

      - name: Run the CLI in the image
        run: |
          docker run --rm udondan/transitous --version
          docker run --rm udondan/transitous --help

      - run: mise run docker-register ci

      # The gateway only verifies signatures of images under mcp/, and finds
      # the locally built image without pulling it.
      - name: List tools through the gateway
        run: |
          docker mcp gateway run --profile ci --dry-run --verbose 2>&1 | tee gateway.log
          grep -E "transitous: \(4 tools\)" gateway.log

  # The only required status check. Every job must have run and succeeded: a
  # skipped job must never let a PR become mergeable, least of all through
  # automerge. Only these may be skipped:
  # - coverage: on main and when build didn't succeed, which fails this job
  #   anyway, or when build was skipped for lack of changes;
  # - boarding-gate: for pull requests from forks;
  # - changes: outside of pull requests;
  # - build, docker, actions and tdqs: when changes found nothing they use.
  required:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - actions
      - boarding-gate
      - build
      - changes
      - coverage
      - docker
      - qlty
      - tdqs
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          failed=$(echo "$RESULTS" | jq -r --argjson fork "$FORK" --argjson pr "$PULL_REQUEST" '
            (.changes.outputs // {}) as $changed
            | def may_skip:
                .key == "coverage"
                or (.key == "boarding-gate" and $fork)
                or (.key == "changes" and ($pr | not))
                or (.key == "build" and $pr and $changed.code == "false")
                or (.key == "docker" and $pr and $changed.docker == "false")
                or (.key == "actions" and $pr and $changed.actions == "false")
                or (.key == "tdqs" and $pr and $changed.tools == "false");
              to_entries[]
              | select(.value.result != "success" and (.value.result != "skipped" or (may_skip | not)))
              | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::Not all jobs succeeded:"
            echo "$failed"
            exit 1
          fi
          echo 'Success'
